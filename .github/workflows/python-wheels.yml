name: Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      CIBW_SKIP: "*-musllinux_*"
      CIBW_TEST_SKIP: "*"
      CIBW_TEST_COMMAND: >-
        python -c "import hightorque_robot, hightorque_robot._core; print(hightorque_robot.__version__)"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheels
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/python-build/dist
          {
            echo "==> building cp38-cp314 wheels"
            CIBW_BUILD="cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*" \
            CIBW_VERSION_SPEC="cibuildwheel==3.4.1" \
              tools/python-build/build_wheels.sh "${{ matrix.arch }}"

            echo "==> verifying expected wheel tags"
            shopt -s nullglob
            for tag in cp38 cp39 cp310 cp311 cp312 cp313 cp314; do
              matches=(tools/python-build/dist/*-"${tag}"-*.whl)
              if [ "${#matches[@]}" -eq 0 ]; then
                echo "error: missing ${tag} wheel" >&2
                exit 1
              fi
              printf '  - %s: %s\n' "${tag}" "${matches[0]}"
            done
          } 2>&1 | tee build-linux.log

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          tail="$(tail -100 build-linux.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::error title=Linux wheel build failed::${tail}"
          exit 1

      - name: Upload wheels
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: hightorque-robot-linux-${{ matrix.arch }}-cp38-cp314
          path: tools/python-build/dist/*.whl
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hightorque-robot-linux-${{ matrix.arch }}-cp38-cp314-log
          path: build-linux.log
          if-no-files-found: ignore

  windows-amd64:
    name: Windows AMD64 wheels
    runs-on: windows-2022
    env:
      CIBW_TEST_SKIP: "*"
      CIBW_TEST_COMMAND: >-
        python -c "import hightorque_robot, hightorque_robot._core; print(hightorque_robot.__version__)"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheels
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          Remove-Item -LiteralPath tools/python-build/dist -Recurse -Force -ErrorAction SilentlyContinue

          $env:CIBW_BUILD = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          $env:CIBW_VERSION_SPEC = "cibuildwheel==3.4.1"
          powershell -ExecutionPolicy Bypass -File tools/python-build/build_wheels.ps1 2>&1 |
            Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Write-Host "==> verifying expected wheel tags"
          foreach ($tag in @("cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314")) {
            $matches = @(Get-ChildItem -LiteralPath tools/python-build/dist -Filter "*-$tag-*.whl")
            if ($matches.Count -eq 0) {
              throw "Missing $tag wheel"
            }
            Write-Host "  - ${tag}: $($matches[0].Name)"
          }

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = (Get-Content -LiteralPath build-windows.log -Tail 100) -join "%0A"
          $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Windows wheel build failed::$tail"
          exit 1

      - name: Upload wheels
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: hightorque-robot-windows-amd64-cp38-cp314
          path: tools/python-build/dist/*.whl
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hightorque-robot-windows-amd64-cp38-cp314-log
          path: build-windows.log
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows-amd64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download Python wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: hightorque-robot-*-cp38-cp314
          path: dist/wheels
          merge-multiple: false

      - name: Prepare C++ source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded artifact files:"
          find dist -type f -printf '  - %p\n' | sort
          release_tag="${GITHUB_REF_NAME}"
          bundles=()
          bundle_wheels() {
            local platform="$1"
            local source_dir="dist/wheels/hightorque-robot-${platform}-cp38-cp314"
            local output="dist/hightorque-robot-${release_tag}-${platform}-python-wheels.zip"
            local wheel_tag
            local -a wheels

            if [ ! -d "${source_dir}" ]; then
              echo "::error title=Missing wheel artifact::${source_dir} was not downloaded"
              exit 1
            fi

            mapfile -d '' wheels < <(find "${source_dir}" -type f -name '*.whl' -print0 | sort -z)
            if [ "${#wheels[@]}" -lt 7 ]; then
              echo "::error title=Too few wheels::${platform} has ${#wheels[@]} wheels, expected at least 7"
              exit 1
            fi
            for wheel_tag in cp38 cp39 cp310 cp311 cp312 cp313 cp314; do
              if ! find "${source_dir}" -type f -name "*-${wheel_tag}-*.whl" -print -quit | grep -q .; then
                echo "::error title=Missing Python wheel::${platform} has no ${wheel_tag} wheel"
                exit 1
              fi
            done

            rm -f "${output}"
            zip -q -j "${output}" "${wheels[@]}"
            bundles+=("${output}")
            printf 'Python wheel bundle (%s):\n  - %s\n' "${platform}" "${output}"
          }

          bundle_wheels linux-x86_64
          bundle_wheels linux-aarch64
          bundle_wheels windows-amd64

          cpp_archive="dist/hightorque-robot-${release_tag}-cpp-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="hightorque-robot-${release_tag}-cpp-source/" \
            "${GITHUB_SHA}" \
            CMakeLists.txt include src lib example robot_param \
            > "${cpp_archive}"

          sha256sum "${bundles[@]}" "${cpp_archive}" > dist/SHA256SUMS
          printf 'C++ source archive:\n  - %s\n' "${cpp_archive}"
          printf 'Python wheel bundles (%s):\n' "${#bundles[@]}"
          printf '  - %s\n' "${bundles[@]}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mapfile -d '' assets < <(find dist -type f \( -name '*-python-wheels.zip' -o -name '*-cpp-source.tar.gz' -o -name 'SHA256SUMS' \) -print0 | sort -z)
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --verify-tag \
              --title "hightorque-robot ${tag}" \
              --generate-notes
          fi
          gh release upload "${tag}" "${assets[@]}" --clobber
